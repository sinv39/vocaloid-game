<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>上传歌曲</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Microsoft YaHei', Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            padding: 40px;
            max-width: 600px;
            width: 100%;
        }

        h1 {
            color: #667eea;
            margin-bottom: 30px;
            font-size: 2.5em;
            text-align: center;
        }

        .form-group {
            margin-bottom: 25px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            color: #333;
            font-weight: bold;
            font-size: 1.1em;
        }

        input[type="text"],
        input[type="file"] {
            width: 100%;
            padding: 12px;
            border: 2px solid #ddd;
            border-radius: 10px;
            font-size: 1em;
            transition: border-color 0.3s;
        }

        input[type="text"]:focus,
        input[type="file"]:focus {
            outline: none;
            border-color: #667eea;
        }

        .file-input-wrapper {
            position: relative;
        }

        input[type="file"] {
            padding: 15px;
            cursor: pointer;
        }

        .upload-btn {
            width: 100%;
            padding: 15px;
            background: #28a745;
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 1.2em;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s;
        }

        .upload-btn:hover {
            background: #218838;
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(40, 167, 69, 0.4);
        }

        .upload-btn:disabled {
            background: #ccc;
            cursor: not-allowed;
            transform: none;
        }

        .message {
            margin-top: 20px;
            padding: 15px;
            border-radius: 10px;
            text-align: center;
            font-weight: bold;
            display: none;
        }

        .message.success {
            background: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
        }

        .message.error {
            background: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
        }

        .nav-links {
            margin-top: 30px;
            text-align: center;
        }

        .nav-links a {
            color: #667eea;
            text-decoration: none;
            font-weight: bold;
            margin: 0 15px;
            transition: color 0.3s;
        }

        .nav-links a:hover {
            color: #764ba2;
            text-decoration: underline;
        }

        .info {
            background: #e7f3ff;
            border: 1px solid #b3d9ff;
            color: #0056b3;
            padding: 15px;
            border-radius: 10px;
            margin-bottom: 25px;
            font-size: 0.9em;
        }

        .file-info {
            margin-top: 10px;
            color: #666;
            font-size: 0.9em;
        }

        .upload-mode-selector {
            display: flex;
            gap: 15px;
            margin-bottom: 25px;
            padding: 15px;
            background: #f8f9fa;
            border-radius: 10px;
        }

        .upload-mode-selector label {
            display: flex;
            align-items: center;
            cursor: pointer;
            font-weight: normal;
            margin-bottom: 0;
        }

        .upload-mode-selector input[type="radio"] {
            width: auto;
            margin-right: 8px;
            cursor: pointer;
        }

        .form-group.hidden {
            display: none;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>📤 上传歌曲</h1>

        <div class="info" id="infoBox">
            <strong>提示：</strong>支持MP3等音频格式，文件大小不超过5MB
        </div>

        <form id="uploadForm">
            <div class="upload-mode-selector">
                <label>
                    <input type="radio" name="uploadMode" value="single" checked onchange="switchUploadMode()">
                    单文件上传
                </label>
                <label>
                    <input type="radio" name="uploadMode" value="batch" onchange="switchUploadMode()">
                    批量上传
                </label>
            </div>

            <div class="form-group" id="titleGroup">
                <label for="musicTitle">歌曲名称 *</label>
                <input type="text" id="musicTitle" name="title" 
                       placeholder="请输入歌曲名称" maxlength="255">
            </div>

            <div class="form-group">
                <label for="musicFile" id="fileLabel">选择音频文件 *</label>
                <div class="file-input-wrapper">
                    <input type="file" id="musicFile" name="file" required 
                           accept="audio/*" onchange="handleFileSelect(this)">
                    <div class="file-info" id="fileInfo"></div>
                </div>
            </div>

            <button type="submit" class="upload-btn" id="submitBtn">
                🎵 上传歌曲
            </button>
        </form>

        <div class="message" id="message"></div>

        <div class="nav-links">
            <a href="index.html">🎮 猜歌游戏</a>
            <a href="manage.html">⚙️ 管理歌曲</a>
        </div>
    </div>

    <script>
        const form = document.getElementById('uploadForm');
        const messageDiv = document.getElementById('message');
        const submitBtn = document.getElementById('submitBtn');
        let isBatchMode = false;

        // 切换上传模式
        function switchUploadMode() {
            const mode = document.querySelector('input[name="uploadMode"]:checked').value;
            isBatchMode = mode === 'batch';
            const titleGroup = document.getElementById('titleGroup');
            const fileInput = document.getElementById('musicFile');
            const fileLabel = document.getElementById('fileLabel');
            const infoBox = document.getElementById('infoBox');
            const titleInput = document.getElementById('musicTitle');

            if (isBatchMode) {
                // 批量上传模式
                titleGroup.classList.add('hidden');
                titleInput.removeAttribute('required');
                fileInput.setAttribute('accept', '.zip');
                fileLabel.textContent = '选择ZIP压缩包 *';
                infoBox.innerHTML = '<strong>提示：</strong>请上传ZIP格式压缩包，压缩包内应全部为音频文件（MP3、WAV、M4A等），且不能包含文件夹。每个音频文件大小不超过5MB，压缩包总大小不超过50MB。文件名将作为歌曲名称。';
                submitBtn.textContent = '📦 批量上传';
            } else {
                // 单文件上传模式
                titleGroup.classList.remove('hidden');
                titleInput.setAttribute('required', 'required');
                fileInput.setAttribute('accept', 'audio/*');
                fileLabel.textContent = '选择音频文件 *';
                infoBox.innerHTML = '<strong>提示：</strong>支持MP3等音频格式，文件大小不超过5MB';
                submitBtn.textContent = '🎵 上传歌曲';
            }

            // 重置表单
            form.reset();
            document.getElementById('fileInfo').textContent = '';
            messageDiv.style.display = 'none';
        }

        // 处理文件选择
        function handleFileSelect(input) {
            const file = input.files[0];
            const fileInfo = document.getElementById('fileInfo');
            
            if (file) {
                const fileSize = (file.size / 1024 / 1024).toFixed(2);
                fileInfo.textContent = `已选择: ${file.name} (${fileSize} MB)`;
                
                if (isBatchMode) {
                    // 批量上传模式：检查是否为ZIP文件
                    if (!file.name.toLowerCase().endsWith('.zip')) {
                        fileInfo.textContent = '请选择ZIP格式的压缩包';
                        fileInfo.style.color = '#dc3545';
                    } else if (file.size > 50 * 1024 * 1024) {
                        fileInfo.textContent = '压缩包大小超过50MB限制';
                        fileInfo.style.color = '#dc3545';
                    } else {
                        fileInfo.style.color = '#28a745';
                    }
                } else {
                    // 单文件上传模式：检查文件大小
                    if (file.size > 5 * 1024 * 1024) {
                        fileInfo.textContent = '文件大小超过5MB限制';
                        fileInfo.style.color = '#dc3545';
                    } else {
                        fileInfo.style.color = '#28a745';
                    }
                }
            }
        }

        // 表单提交
        form.addEventListener('submit', async (e) => {
            e.preventDefault();

            const formData = new FormData();
            const fileInput = document.getElementById('musicFile');

            if (!fileInput.files[0]) {
                showMessage('请选择要上传的文件', 'error');
                return;
            }

            // 禁用提交按钮
            submitBtn.disabled = true;
            submitBtn.textContent = isBatchMode ? '上传中...' : '上传中...';

            try {
                let url, result;
                
                if (isBatchMode) {
                    // 批量上传
                    formData.append('file', fileInput.files[0]);
                    url = '/api/music/batch-upload';
                } else {
                    // 单文件上传
                    const titleInput = document.getElementById('musicTitle');
                    if (!titleInput.value.trim()) {
                        showMessage('请输入歌曲名称', 'error');
                        submitBtn.disabled = false;
                        submitBtn.textContent = '🎵 上传歌曲';
                        return;
                    }
                    formData.append('file', fileInput.files[0]);
                    formData.append('title', titleInput.value);
                    url = '/api/music/upload';
                }

                const response = await fetch(url, {
                    method: 'POST',
                    body: formData
                });

                result = await response.text();

                if (response.ok) {
                    showMessage(result, 'success');
                    form.reset();
                    document.getElementById('fileInfo').textContent = '';
                } else {
                    showMessage(result, 'error');
                }
            } catch (error) {
                showMessage('上传失败: ' + error.message, 'error');
            } finally {
                submitBtn.disabled = false;
                submitBtn.textContent = isBatchMode ? '📦 批量上传' : '🎵 上传歌曲';
            }
        });

        // 显示消息
        function showMessage(text, type) {
            messageDiv.textContent = text;
            messageDiv.className = `message ${type}`;
            messageDiv.style.display = 'block';

            // 3秒后自动隐藏成功消息
            if (type === 'success') {
                setTimeout(() => {
                    messageDiv.style.display = 'none';
                }, 3000);
            }
        }
    </script>
</body>
</html>
