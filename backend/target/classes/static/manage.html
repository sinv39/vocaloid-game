<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>管理歌曲</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Microsoft YaHei', Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1000px;
            margin: 0 auto;
        }

        .header {
            background: white;
            border-radius: 20px 20px 0 0;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
            padding: 30px;
            text-align: center;
        }

        h1 {
            color: #667eea;
            margin-bottom: 10px;
            font-size: 2.5em;
        }

        .subtitle {
            color: #666;
            font-size: 1.1em;
        }

        .content {
            background: white;
            border-radius: 0 0 20px 20px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
            padding: 30px;
            min-height: 400px;
        }

        .controls {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 25px;
            flex-wrap: wrap;
            gap: 15px;
        }

        .refresh-btn {
            padding: 10px 20px;
            background: #17a2b8;
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 1em;
            transition: all 0.3s;
        }

        .refresh-btn:hover {
            background: #138496;
            transform: translateY(-2px);
        }

        .stats {
            color: #666;
            font-size: 1em;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            background: white;
        }

        thead {
            background: #f8f9fa;
        }

        th {
            padding: 15px;
            text-align: left;
            color: #333;
            font-weight: bold;
            border-bottom: 2px solid #dee2e6;
        }

        td {
            padding: 15px;
            border-bottom: 1px solid #dee2e6;
            color: #666;
        }

        tr:hover {
            background: #f8f9fa;
        }

        .title-cell {
            font-weight: bold;
            color: #333;
            max-width: 300px;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .time-cell {
            color: #999;
            font-size: 0.9em;
        }

        .actions {
            display: flex;
            gap: 10px;
        }

        .btn-play, .btn-delete {
            padding: 8px 15px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 0.9em;
            transition: all 0.3s;
        }

        .btn-play {
            background: #28a745;
            color: white;
        }

        .btn-play:hover {
            background: #218838;
        }

        .btn-delete {
            background: #dc3545;
            color: white;
        }

        .btn-delete:hover {
            background: #c82333;
        }

        .empty-state {
            text-align: center;
            padding: 60px 20px;
            color: #999;
        }

        .empty-state h3 {
            margin-bottom: 10px;
            color: #666;
        }

        .nav-links {
            text-align: center;
            margin-top: 30px;
        }

        .nav-links a {
            color: white;
            text-decoration: none;
            font-weight: bold;
            margin: 0 15px;
            transition: all 0.3s;
            display: inline-block;
        }

        .nav-links a:hover {
            text-decoration: underline;
            transform: translateY(-2px);
        }

        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.5);
            z-index: 1000;
            justify-content: center;
            align-items: center;
        }

        .modal.show {
            display: flex;
        }

        .modal-content {
            background: white;
            padding: 30px;
            border-radius: 15px;
            max-width: 400px;
            width: 90%;
            text-align: center;
        }

        .modal-content h3 {
            margin-bottom: 20px;
            color: #333;
        }

        .modal-buttons {
            display: flex;
            gap: 15px;
            justify-content: center;
            margin-top: 20px;
        }

        .modal-btn {
            padding: 10px 25px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 1em;
        }

        .modal-btn.cancel {
            background: #6c757d;
            color: white;
        }

        .modal-btn.confirm {
            background: #dc3545;
            color: white;
        }

        .loading {
            text-align: center;
            padding: 40px;
            color: #666;
        }

        .upload-section {
            background: #f8f9fa;
            border-radius: 10px;
            padding: 20px;
            margin-bottom: 25px;
            border: 2px dashed #667eea;
        }

        .upload-title {
            font-size: 1.2em;
            color: #333;
            margin-bottom: 15px;
            font-weight: bold;
        }

        .file-input-wrapper {
            position: relative;
            overflow: hidden;
            display: inline-block;
        }

        .file-input-wrapper input[type=file] {
            position: absolute;
            left: -9999px;
        }

        .file-input-label {
            padding: 12px 25px;
            background: #667eea;
            color: white;
            border-radius: 8px;
            cursor: pointer;
            display: inline-block;
            transition: all 0.3s;
        }

        .file-input-label:hover {
            background: #5568d3;
            transform: translateY(-2px);
        }

        .upload-btn {
            padding: 12px 25px;
            background: #28a745;
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 1em;
            margin-left: 15px;
            transition: all 0.3s;
        }

        .upload-btn:hover {
            background: #218838;
            transform: translateY(-2px);
        }

        .upload-btn:disabled {
            background: #6c757d;
            cursor: not-allowed;
            transform: none;
        }

        .file-count {
            margin-left: 15px;
            color: #666;
            font-size: 0.9em;
        }

        .upload-progress {
            margin-top: 15px;
            padding: 15px;
            background: white;
            border-radius: 8px;
            display: none;
        }

        .upload-progress.show {
            display: block;
        }

        .progress-text {
            color: #333;
            margin-bottom: 10px;
        }

        .btn-delete-all {
            padding: 10px 20px;
            background: #dc3545;
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 1em;
            transition: all 0.3s;
        }

        .btn-delete-all:hover {
            background: #c82333;
            transform: translateY(-2px);
        }

        .btn-edit {
            padding: 8px 15px;
            background: #ffc107;
            color: #333;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 0.9em;
            transition: all 0.3s;
            margin-right: 5px;
        }

        .btn-edit:hover {
            background: #e0a800;
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- 密钥验证界面 -->
        <div id="authSection" class="header">
            <h1>🔐 管理员验证</h1>
            <p class="subtitle">请输入管理密钥以访问管理页面</p>
            <div style="margin-top: 30px;">
                <input type="password" id="secretKeyInput" placeholder="请输入密钥" 
                       style="padding: 12px 20px; font-size: 16px; border: 2px solid #667eea; border-radius: 8px; width: 300px; margin-bottom: 15px;">
                <br>
                <button onclick="verifySecretKey()" 
                        style="padding: 12px 30px; background: #667eea; color: white; border: none; border-radius: 8px; cursor: pointer; font-size: 16px; transition: all 0.3s;">
                    🔓 验证
                </button>
                <p id="authError" style="color: #dc3545; margin-top: 15px; display: none;">密钥错误，请重试</p>
            </div>
        </div>

        <!-- 管理内容（初始隐藏） -->
        <div id="adminContent" style="display: none;">
            <div class="header">
                <h1>⚙️ 管理歌曲</h1>
                <p class="subtitle">查看和管理所有歌曲</p>
            </div>

            <div class="content">
            <!-- 批量上传区域 -->
            <div class="upload-section">
                <div class="upload-title">📁 批量上传歌曲（文件夹）</div>
                <div style="display: flex; align-items: center; flex-wrap: wrap; gap: 10px;">
                    <div class="file-input-wrapper">
                        <input type="file" id="folderInput" webkitdirectory directory multiple 
                               onchange="handleFileSelect(event)">
                        <label for="folderInput" class="file-input-label">
                            📂 选择文件夹
                        </label>
                    </div>
                    <button class="upload-btn" id="uploadBtn" onclick="uploadFiles()" disabled>
                        ⬆️ 开始上传
                    </button>
                    <span class="file-count" id="fileCount"></span>
                </div>
                <div class="upload-progress" id="uploadProgress">
                    <div class="progress-text" id="progressText">准备上传...</div>
                </div>
                <p style="margin-top: 10px; color: #666; font-size: 0.9em;">
                    💡 提示：支持 .mp3, .wav, .ogg 格式，单个文件不超过5MB。歌曲名称将自动使用文件名。
                </p>
            </div>

            <div class="controls">
                <button class="refresh-btn" onclick="loadMusicList()">🔄 刷新列表</button>
                <button class="btn-delete-all" onclick="showDeleteAllModal()">🗑️ 全部删除</button>
                <div class="stats" id="stats">共 0 首歌曲</div>
            </div>

            <div id="loading" class="loading">加载中...</div>
            <div id="musicTable" style="display: none;">
                <table>
                    <thead>
                        <tr>
                            <th>ID</th>
                            <th>歌曲名称</th>
                            <th>上传时间</th>
                            <th>操作</th>
                        </tr>
                    </thead>
                    <tbody id="musicListBody">
                    </tbody>
                </table>
            </div>

            <div id="emptyState" class="empty-state" style="display: none;">
                <h3>📭 暂无歌曲</h3>
                <p>快去上传一些歌曲吧！</p>
            </div>
        </div>
    </div>

    <!-- 删除确认对话框 -->
    <div class="modal" id="deleteModal">
        <div class="modal-content">
            <h3>⚠️ 确认删除</h3>
            <p>确定要删除这首歌曲吗？此操作不可恢复。</p>
            <div class="modal-buttons">
                <button class="modal-btn cancel" onclick="closeDeleteModal()">取消</button>
                <button class="modal-btn confirm" onclick="confirmDelete()">确认删除</button>
            </div>
        </div>
    </div>

    <!-- 全部删除确认对话框 -->
    <div class="modal" id="deleteAllModal">
        <div class="modal-content">
            <h3>⚠️ 确认全部删除</h3>
            <p style="color: #dc3545; font-weight: bold;">警告：此操作将删除所有歌曲，且不可恢复！</p>
            <div class="modal-buttons">
                <button class="modal-btn cancel" onclick="closeDeleteAllModal()">取消</button>
                <button class="modal-btn confirm" onclick="confirmDeleteAll()">确认全部删除</button>
            </div>
        </div>
    </div>

    <!-- 修改名称对话框 -->
    <div class="modal" id="editModal">
        <div class="modal-content">
            <h3>✏️ 修改歌曲名称</h3>
            <input type="text" id="editTitleInput" placeholder="请输入新的歌曲名称" 
                   style="width: 100%; padding: 12px; margin-top: 15px; border: 2px solid #667eea; border-radius: 8px; font-size: 1em;">
            <div class="modal-buttons">
                <button class="modal-btn cancel" onclick="closeEditModal()">取消</button>
                <button class="modal-btn confirm" style="background: #ffc107; color: #333;" onclick="confirmEdit()">保存</button>
            </div>
        </div>
    </div>

    <div class="nav-links">
        <a href="index.html">🎮 猜歌游戏</a>
        <a href="upload.html">📤 上传歌曲</a>
    </div>

    <script>
        let musicList = [];
        let currentDeleteId = null;
        let adminSecretKey = localStorage.getItem('adminSecretKey') || ''; // 从localStorage读取
        let selectedFiles = [];
        let currentEditId = null; // 当前编辑的歌曲ID

        // 页面加载时自动验证密钥
        window.addEventListener('DOMContentLoaded', function() {
            if (adminSecretKey) {
                // 如果localStorage中有密钥，自动验证
                verifySecretKey(true);
            }
        });

        // 验证密钥
        function verifySecretKey(autoVerify = false) {
            const input = document.getElementById('secretKeyInput').value;
            if (!autoVerify && !input) {
                document.getElementById('authError').style.display = 'block';
                return;
            }
            
            const keyToVerify = autoVerify ? adminSecretKey : input;
            
            // 调用后端check接口验证密钥
            fetch('/api/music/check', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify({ secretKey: keyToVerify })
            })
            .then(response => {
                if (response.ok) {
                    // 密钥正确，保存到localStorage并显示管理内容
                    if (!autoVerify) {
                        adminSecretKey = input;
                        localStorage.setItem('adminSecretKey', adminSecretKey);
                    }
                    document.getElementById('authSection').style.display = 'none';
                    document.getElementById('adminContent').style.display = 'block';
                    loadMusicList();
                } else {
                    // 密钥错误
                    if (!autoVerify) {
                        document.getElementById('authError').style.display = 'block';
                        adminSecretKey = '';
                        localStorage.removeItem('adminSecretKey');
                    } else {
                        // 自动验证失败，清除localStorage
                        localStorage.removeItem('adminSecretKey');
                    }
                }
            })
            .catch(error => {
                console.error('验证失败:', error);
                if (!autoVerify) {
                    document.getElementById('authError').style.display = 'block';
                }
                adminSecretKey = '';
                localStorage.removeItem('adminSecretKey');
            });
        }

        // 支持回车键验证
        document.addEventListener('DOMContentLoaded', function() {
            document.getElementById('secretKeyInput').addEventListener('keypress', function(e) {
                if (e.key === 'Enter') {
                    verifySecretKey();
                }
            });
        });

        // 处理文件选择
        function handleFileSelect(event) {
            const files = Array.from(event.target.files);
            
            // 过滤出音频文件
            selectedFiles = files.filter(file => {
                const filename = file.name.toLowerCase();
                return filename.endsWith('.mp3') || 
                       filename.endsWith('.wav') || 
                       filename.endsWith('.ogg');
            });
            
            const fileCountElement = document.getElementById('fileCount');
            const uploadBtn = document.getElementById('uploadBtn');
            
            if (selectedFiles.length > 0) {
                fileCountElement.textContent = `已选择 ${selectedFiles.length} 个音频文件`;
                uploadBtn.disabled = false;
            } else {
                fileCountElement.textContent = '未找到音频文件';
                uploadBtn.disabled = true;
            }
        }

        // 上传文件
        async function uploadFiles() {
            if (selectedFiles.length === 0) {
                alert('请先选择文件夹！');
                return;
            }

            const uploadProgress = document.getElementById('uploadProgress');
            const progressText = document.getElementById('progressText');
            const uploadBtn = document.getElementById('uploadBtn');
            
            uploadProgress.classList.add('show');
            uploadBtn.disabled = true;
            progressText.textContent = `正在上传 ${selectedFiles.length} 个文件...`;

            try {
                const formData = new FormData();
                selectedFiles.forEach(file => {
                    formData.append('files', file);
                });

                const response = await fetch('/api/music/batch-upload', {
                    method: 'POST',
                    headers: {
                        'X-Admin-Secret': adminSecretKey
                    },
                    body: formData
                });

                const result = await response.text();
                
                if (response.ok) {
                    progressText.textContent = result;
                    alert(result);
                    
                    // 清空选择
                    document.getElementById('folderInput').value = '';
                    selectedFiles = [];
                    document.getElementById('fileCount').textContent = '';
                    uploadBtn.disabled = true;
                    
                    // 重新加载歌曲列表
                    loadMusicList();
                } else {
                    progressText.textContent = '上传失败：' + result;
                    alert('上传失败：' + result);
                }
            } catch (error) {
                console.error('上传失败:', error);
                progressText.textContent = '上传失败：' + error.message;
                alert('上传失败：' + error.message);
            } finally {
                uploadBtn.disabled = false;
            }
        }

        // 加载歌曲列表
        async function loadMusicList() {
            document.getElementById('loading').style.display = 'block';
            document.getElementById('musicTable').style.display = 'none';
            document.getElementById('emptyState').style.display = 'none';

            try {
                const response = await fetch('/api/music/list', {
                    headers: {
                        'X-Admin-Secret': adminSecretKey
                    }
                });
                if (response.ok) {
                    musicList = await response.json();
                    displayMusicList();
                } else {
                    alert('加载失败，请稍后重试');
                }
            } catch (error) {
                console.error('加载失败:', error);
                alert('加载失败，请稍后重试');
            } finally {
                document.getElementById('loading').style.display = 'none';
            }
        }

        // 显示歌曲列表
        function displayMusicList() {
            const tbody = document.getElementById('musicListBody');
            const statsDiv = document.getElementById('stats');
            
            statsDiv.textContent = `共 ${musicList.length} 首歌曲`;

            if (musicList.length === 0) {
                document.getElementById('emptyState').style.display = 'block';
                return;
            }

            document.getElementById('musicTable').style.display = 'block';
            
            tbody.innerHTML = musicList.map(music => {
                const uploadTime = new Date(music.uploadTime).toLocaleString('zh-CN');
                return `
                    <tr>
                        <td>${music.id}</td>
                        <td class="title-cell">${escapeHtml(music.title)}</td>
                        <td class="time-cell">${uploadTime}</td>
                        <td>
                            <div class="actions">
                                <button class="btn-edit" onclick="showEditModal(${music.id}, '${escapeHtml(music.title)}')">✏️ 编辑</button>
                                <button class="btn-play" onclick="playMusic(${music.id})">▶️ 播放</button>
                                <button class="btn-delete" onclick="showDeleteModal(${music.id})">🗑️ 删除</button>
                            </div>
                        </td>
                    </tr>
                `;
            }).join('');
        }

        // 播放歌曲
        function playMusic(id) {
            window.open(`/api/music/play/${id}`, '_blank');
        }

        // 显示删除确认对话框
        function showDeleteModal(id) {
            currentDeleteId = id;
            document.getElementById('deleteModal').classList.add('show');
        }

        // 关闭删除确认对话框
        function closeDeleteModal() {
            document.getElementById('deleteModal').classList.remove('show');
            currentDeleteId = null;
        }

        // 确认删除
        async function confirmDelete() {
            if (!currentDeleteId) return;

            try {
                const response = await fetch(`/api/music/${currentDeleteId}`, {
                    method: 'DELETE',
                    headers: {
                        'X-Admin-Secret': adminSecretKey
                    }
                });

                if (response.ok) {
                    alert('删除成功！');
                    closeDeleteModal();
                    loadMusicList(); // 重新加载列表
                } else {
                    const result = await response.text();
                    alert('删除失败: ' + result);
                }
            } catch (error) {
                console.error('删除失败:', error);
                alert('删除失败: ' + error.message);
            }
        }

        // HTML转义
        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        // ========== 全部删除功能 ==========
        
        // 显示全部删除确认对话框
        function showDeleteAllModal() {
            if (musicList.length === 0) {
                alert('当前没有歌曲可删除！');
                return;
            }
            document.getElementById('deleteAllModal').classList.add('show');
        }

        // 关闭全部删除确认对话框
        function closeDeleteAllModal() {
            document.getElementById('deleteAllModal').classList.remove('show');
        }

        // 确认全部删除
        async function confirmDeleteAll() {
            try {
                const response = await fetch('/api/music/all', {
                    method: 'DELETE',
                    headers: {
                        'X-Admin-Secret': adminSecretKey
                    }
                });

                if (response.ok) {
                    const result = await response.text();
                    alert(result);
                    closeDeleteAllModal();
                    loadMusicList(); // 重新加载列表
                } else {
                    const result = await response.text();
                    alert('删除失败: ' + result);
                }
            } catch (error) {
                console.error('删除失败:', error);
                alert('删除失败: ' + error.message);
            }
        }

        // ========== 修改名称功能 ==========
        
        // 显示编辑对话框
        function showEditModal(id, title) {
            currentEditId = id;
            document.getElementById('editTitleInput').value = title;
            document.getElementById('editModal').classList.add('show');
            // 自动聚焦到输入框
            setTimeout(() => {
                document.getElementById('editTitleInput').focus();
            }, 100);
        }

        // 关闭编辑对话框
        function closeEditModal() {
            document.getElementById('editModal').classList.remove('show');
            currentEditId = null;
        }

        // 确认修改名称
        async function confirmEdit() {
            if (!currentEditId) return;

            const newTitle = document.getElementById('editTitleInput').value.trim();
            if (!newTitle) {
                alert('歌曲名称不能为空！');
                return;
            }

            try {
                const response = await fetch(`/api/music/${currentEditId}/title`, {
                    method: 'PUT',
                    headers: {
                        'Content-Type': 'application/json',
                        'X-Admin-Secret': adminSecretKey
                    },
                    body: JSON.stringify({ title: newTitle })
                });

                if (response.ok) {
                    const result = await response.text();
                    alert(result);
                    closeEditModal();
                    loadMusicList(); // 重新加载列表
                } else {
                    const result = await response.text();
                    alert('修改失败: ' + result);
                }
            } catch (error) {
                console.error('修改失败:', error);
                alert('修改失败: ' + error.message);
            }
        }

        // 支持在编辑对话框中按回车保存
        document.addEventListener('DOMContentLoaded', function() {
            document.getElementById('editTitleInput').addEventListener('keypress', function(e) {
                if (e.key === 'Enter') {
                    confirmEdit();
                }
            });
        });
